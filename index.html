<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#775d3c">
  <title>沖縄三線・工工四エディター</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">絲庵 SHIAN</span><h1>沖縄三線・工工四エディター</h1></div>
    <span id="saveState" aria-live="polite">自動保存</span>
  </header>

  <main>
    <section class="panel settings" aria-label="曲の設定">
      <label>題名<input id="title" maxlength="60" value="童神"></label>
      <label>作者<input id="author" maxlength="60" value="沖縄童謡"></label>
      <label>ちんだみ<select id="tuning"><option>本調子</option><option>二揚げ</option><option>三下げ</option></select></label>
      <label>速度 <output id="tempoOut">100</output><input id="tempo" type="range" min="40" max="180" value="100"></label>
    </section>

    <section class="toolbar" aria-label="編集操作">
      <button id="newBtn">新規</button><button id="sampleBtn">童神の見本</button>
      <button id="addColBtn">列を追加</button><button id="removeColBtn">列を削除</button>
      <button id="undoBtn">元に戻す</button><button id="exportBtn">保存</button>
      <label class="fileBtn">読込<input id="importFile" type="file" accept="application/json,.json"></label>
      <button id="printBtn">印刷・PDF</button>
    </section>

    <section class="workspace">
      <aside class="palette" aria-label="工工四記号">
        <h2>記号</h2><div id="palette"></div>
        <button id="eraseBtn" class="danger">消す</button>
        <p>記号を選び、譜面の枠を押します。もう一度押すと解除します。</p>
      </aside>
      <section class="paperWrap">
        <div id="paper" class="paper" aria-label="縦書き工工四譜面">
          <div class="paperTitle"><b id="paperTitle">童神</b><span id="paperMeta">沖縄童謡・本調子</span></div>
          <div id="score" class="score"></div>
        </div>
      </section>
    </section>

    <section class="player panel" aria-label="自動演奏">
      <div><h2>自動演奏</h2><p id="playStatus" aria-live="polite">停止中</p></div>
      <button id="playBtn" class="primary">▶ 最初から演奏</button>
      <button id="stopBtn">■ 停止</button>
      <label>基準音<select id="basePitch"><option value="130.813">C3</option><option value="146.832">D3</option><option value="164.814">E3</option><option value="174.614">F3</option></select></label>
    </section>
  </main>
  <template id="columnTemplate"><div class="scoreCol"><button class="colSelect" title="列を選択"></button><div class="noteCells"></div><textarea class="lyrics" rows="1" maxlength="40" placeholder="歌詞"></textarea></div></template>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#775d3c">
  <title>沖縄三線・工工四エディター</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print-fixes.css">
  <link rel="stylesheet" href="keypad.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">絲庵 SHIAN</span><h1>沖縄三線・工工四エディター</h1></div>
    <span id="saveState" aria-live="polite">自動保存</span>
  </header>

  <main>
    <section class="panel settings" aria-label="曲の設定">
      <label>題名<input id="title" maxlength="60" value="童神"></label>
      <label>作者<input id="author" maxlength="60" value="沖縄童謡"></label>
      <label>ちんだみ<select id="tuning"><option>本調子</option><option>二揚げ</option><option>三下げ</option></select></label>
      <label>速度 <output id="tempoOut">100</output><input id="tempo" type="range" min="40" max="180" value="100"></label>
    </section>
    <section class="panel rhythmSettings" aria-label="リズム設定">
      <div><b>ハネの単位</b><div class="swingButtons"><button data-swing="none" class="active">なし</button><button data-swing="half">半拍</button><button data-swing="beat">1拍</button></div></div>
      <label>ハネの比率 <output id="swingRatioOut">2.0：1</output><input id="swingRatio" type="range" min="1" max="3" step="0.1" value="2"></label>
      <p>速度：<b id="rhythmTempo">100 BPM</b>　<span id="durationOut">所要時間：約0秒</span></p>
    </section>

    <section class="toolbar" aria-label="編集操作">
      <button id="newBtn">新規</button><button id="sampleBtn">童神の見本</button>
      <button id="addColBtn">列を追加</button><button id="removeColBtn">列を削除</button>
      <button id="undoBtn">元に戻す</button><button id="exportBtn">保存</button>
      <label class="fileBtn">読込<input id="importFile" type="file" accept="application/json,.json"></label>
      <button id="printBtn">印刷・PDF</button>
    </section>

    <section class="workspace">
      <aside class="palette" aria-label="工工四記号">
        <h2>勘所とキーボード</h2>
        <img class="kandoImage" src="kando-vertical.svg" alt="三線の勘所図。開放弦と工工四の位置">
        <div class="inputPosition"><button id="beatInputBtn" class="active">1拍</button><button id="halfInputBtn">半拍</button></div>
        <p id="inputStatus" class="inputStatus" aria-live="polite">1列・1拍目へ入力</p>
        <div class="screenKeypad">
          <button data-note="合"><b>合</b><small>7</small></button><button data-note="四"><b>四</b><small>8</small></button><button data-note="工"><b>工</b><small>9</small></button><button data-note="下老"><b>下老</b><small>*</small></button>
          <button data-note="乙"><b>乙</b><small>4</small></button><button data-note="上"><b>上</b><small>5</small></button><button data-note="五"><b>五</b><small>6</small></button><span></span>
          <button data-note="老"><b>老</b><small>1</small></button><button data-note="中"><b>中</b><small>2</small></button><button data-note="六"><b>六</b><small>3</small></button><span></span>
          <span></span><button data-note="尺"><b>尺</b><small>0</small></button><button data-note="七"><b>七</b><small>.</small></button><button data-note="八"><b>八</b><small>Ctrl＋/</small></button>
        </div>
        <h2>譜面を直接タップして入力する音</h2><div id="palette"></div>
        <h2>音の書き方</h2><div class="modeButtons"><button id="normalBtn" class="active">通常</button><button id="kubanchiBtn">小弾</button></div>
        <h2>奏法</h2><div class="modeButtons"><button id="techNoneBtn" class="active">なし</button><button id="uchiBtn">、 打音</button><button id="kakeBtn">┐ 掛音</button></div>
        <h2>歌の記号</h2><div class="lyricSymbols"><button data-lyric-symbol="start">○ 歌い始め</button><button data-lyric-symbol="end">□ 歌い終わり</button><button data-lyric-symbol="open">○カギ</button><button data-lyric-symbol="filled">●カギ</button><button data-lyric-symbol="erase">記号を消す</button></div>
        <label class="markLengthControl">カギの長さ <output id="markLengthOut">2拍</output><input id="markLength" type="range" min="1" max="12" value="2"></label>
        <button id="eraseBtn" class="danger">選択列の音を消す</button>
        <p>大きな枠は1拍です。「＋ 半拍」を押すと、枠と枠の間へ音を入れられます。</p>
      </aside>
      <section class="paperWrap">
        <div id="paper" class="paper" aria-label="縦書き工工四譜面">
          <div class="paperTitle"><b id="paperTitle">童神</b><span id="paperMeta">沖縄童謡・本調子</span></div>
          <div id="score" class="score"></div>
        </div>
      </section>
    </section>

    <section class="player panel" aria-label="自動演奏">
      <div><h2>自動演奏</h2><p id="playStatus" aria-live="polite">停止中</p></div>
      <button id="playBtn" class="primary">▶ 最初から演奏</button>
      <button id="stopBtn">■ 停止</button>
      <label>基準音<select id="basePitch"><option value="130.813">C3</option><option value="146.832">D3</option><option value="164.814">E3</option><option value="174.614">F3</option></select></label>
    </section>
  </main>
  <template id="columnTemplate"><div class="scoreCol"><button class="colSelect" title="列を選択"></button><div class="noteCells"></div><div class="lyricLane"><textarea class="lyrics" rows="1" maxlength="40" placeholder="歌詞"></textarea><div class="lyricMarks"></div></div></div></template>
  <script src="app.js"></script>
</body>
</html>
